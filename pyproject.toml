[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ps5-jailbreak-helper"
version = "1.2.0"
description = "Self-host the PS5 Relapse jailbreak; local DNS + HTTP/HTTPS server so the PS5 user guide loads the exploit payloads."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sekt0r Auto Jailbreak Tool", email = "user@example.com" }]
keywords = ["ps5", "jailbreak", "selfhost", "relapse", "exploit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    # Payload downloads (hash-verified, retryable, cached)
    "pooch>=1.9",
    # Certificate generation (X.509 self-signed, SANs)
    "cryptography>=42",
    # GUI toolkit (PySide6 replacement for the tkinter fallback)
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
ps5jb = "ps5_jb_helper_main:main"

[tool.setuptools]
packages = [
    "ps5_jb_helper",
    "ps5_jb_helper.payloads",
    "ps5_jb_helper.config",
    "ps5_jb_helper.dns",
    "ps5_jb_helper.download",
    "ps5_jb_helper.http",
    "ps5_jb_helper.network",
    "ps5_jb_helper.orchestrator",
    "ps5_jb_helper.selftest",
    "ps5_jb_helper.utils",
    "ps5_jb_helper.cert",
    "ps5_jb_helper.i18n",
    "ps5_jb_helper.gui",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
